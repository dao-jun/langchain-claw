spring:
  datasource:
    url: jdbc:h2:mem:langchainclaw;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful
